name: WorldOL

options:
  bundleIdPrefix: com.worldol
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  # 关键：xcodegen 默认生成 xcode16_0 格式（objectVersion 77），
  # Xcode 15 读不了，会报 "Unable to read project" 且 xcodebuild 退出码 74。
  # 降到 xcode15_3，Xcode 15 / 16 都能打开。
  projectFormat: xcode15_3

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: "NO"
    ALWAYS_SEARCH_USER_PATHS: "NO"
    CLANG_ENABLE_MODULES: "YES"

targets:
  WorldOL:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
      # 蓝色文件夹引用：webroot 会原样拷进 App Bundle，
      # 运行时路径为 WorldOL.app/webroot/...
      - path: webroot
        type: folder
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_NAME: WorldOL
        PRODUCT_BUNDLE_IDENTIFIER: com.worldol.standalone
        MARKETING_VERSION: "1.9.26"
        CURRENT_PROJECT_VERSION: "125"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        # 关键：完全不签名，产出的 .app 交给 ESign / 全能签 重新签名。
        # 注意：不要写 CODE_SIGN_IDENTITY="" 和 ASSETCATALOG_COMPILER_APPICON_NAME=""，
        # 空字符串会让 Xcode 的工程加载器直接失败（xcodebuild 退出码 74）。
        # 关签名只用下面两行就够了。
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        SWIFT_COMPILATION_MODE: wholemodule

# 显式声明共享 scheme。
# 不写的话 xcodegen 不一定生成 scheme，`xcodebuild -scheme WorldOL` 就找不到方案。
schemes:
  WorldOL:
    build:
      targets:
        WorldOL: all
    run:
      config: Debug
    archive:
      config: Release

