name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "ios/**"
      - "tools/**"
      - "archive/**"
      - ".github/workflows/build-ios-ipa.yml"

jobs:
  build:
    # 必须用带 Xcode 16+ 的 runner。
    # macos-14 上是 Xcode 15，读不了最新 XcodeGen 生成的工程格式
    # （objectVersion 77），会直接报 "Unable to read project" 退出码 74。
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 恢复归档分片 → www.bin
        run: |
          python3 tools/worldol_archive.py join archive /tmp/www.bin

      - name: 校验归档
        run: |
          python3 -m pip install --quiet --break-system-packages pycryptodome || python3 -m pip install --quiet pycryptodome
          python3 tools/worldol_archive.py info /tmp/www.bin

      - name: 解包出 webroot
        run: |
          python3 tools/worldol_archive.py extract /tmp/www.bin ios/webroot
          test -f ios/webroot/client/standalone.html
          du -sh ios/webroot

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 诊断（Xcode 版本 / 工程结构）
        working-directory: ios
        run: |
          xcodebuild -version
          echo "---- 工程里的 target 与 scheme ----"
          xcodebuild -list -project WorldOL.xcodeproj || true
          echo "---- webroot 是否进了 sources ----"
          ls -d webroot/client 2>/dev/null && echo "webroot 存在" || echo "webroot 缺失"

      - name: 编译未签名 App
        working-directory: ios
        run: |
          set +e
          # 注意：不要传 CODE_SIGN_IDENTITY=""，空字符串会让工程加载器失败（退出码 74）
          xcodebuild \
            -project WorldOL.xcodeproj \
            -scheme WorldOL \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build > /tmp/build.log 2>&1
          code=$?
          echo "==================== xcodebuild 输出（末尾 150 行）===================="
          tail -n 150 /tmp/build.log
          echo "======================================================================"
          echo "xcodebuild exit=$code"
          if [ $code -ne 0 ]; then
            # 把错误提升为 GitHub 注解，这样不用登录也能通过 API 读到具体报错
            grep -E "error:|error |ERROR|does not contain a scheme|cannot be opened|not found" /tmp/build.log \
              | head -n 25 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code

      - name: 打包未签名 IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/WorldOL.app"
          test -d "$APP"
          rm -rf build/Payload build/WorldOL-unsigned.ipa
          mkdir -p build/Payload
          ditto "$APP" "build/Payload/WorldOL.app"
          ( cd build && zip -qry WorldOL-unsigned.ipa Payload )
          ls -lh build/WorldOL-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: WorldOL-unsigned-ipa
          path: ios/build/WorldOL-unsigned.ipa
          retention-days: 7
          compression-level: 0
